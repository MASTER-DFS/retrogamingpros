<a class="post-card" href="{{ include.post.url | relative_url }}">
  <canvas class="post-icon" data-icon="{{ include.post.icon | default: 'cart' }}" aria-hidden="true"></canvas>
  <span class="post-meta"><time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: '%b %-d, %Y' }}</time> · {{ include.post.content | number_of_words | divided_by: 200 | plus: 1 }} min read</span>
  <h3>{{ include.post.title }}</h3>
  <p>{{ include.post.description }}</p>
  <span class="read-more">Read post <span aria-hidden="true">▶</span></span>
</a>
